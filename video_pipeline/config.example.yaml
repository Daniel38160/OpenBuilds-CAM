# ---------------------------------------------------------------------------
# Config de STYLE de la chaîne — réutilisable tel quel d'un épisode à l'autre.
# Copie ce fichier (en .yaml ou .json) et garde-le : tu le branches avec
#   python make_video.py episodes/epXX --config channel.yaml
# ou place-le dans le dossier de l'épisode sous le nom config.yaml.
#
# Tout est OPTIONNEL : sans config, des valeurs par défaut raisonnables
# s'appliquent. YAML nécessite PyYAML (pip install pyyaml) ; sinon utilise JSON.
# ---------------------------------------------------------------------------

fps: 30
formats: [long]            # long (16:9) | short (9:16) | square | "1280x720"
motion: true              # léger zoom Ken Burns sur les images fixes
transition: fade          # fade (recommandé)
fade_seconds: 0.4
background_color: "0x101418"
font: null                # chemin d'un .ttf ; auto-détecté si null

tts:
  backend: edge           # edge | piper | elevenlabs | espeak | dummy
  voice: fr-FR-DeniseNeural   # voix edge-tts (fr-FR-HenriNeural pour une voix masculine)
  rate: "+0%"             # edge-tts : "+10%" plus rapide, "-10%" plus lent
  words_per_minute: 160   # seulement pour le backend 'dummy'
  # piper_model: /chemin/vers/fr_FR-model.onnx     # backend piper
  # elevenlabs_voice_id: Rachel                    # backend elevenlabs (clé via $ELEVENLABS_API_KEY)
  # elevenlabs_model: eleven_multilingual_v2

logo:
  path: null              # ex: assets/logo.png (PNG transparent conseillé)
  height: 90
  margin: 40
  position: top-right     # top-right | top-left | bottom-right | bottom-left

captions:                 # texte à l'écran par segment ([text: ...])
  enabled: true
  fontsize: 46
  color: white
  box_opacity: 0.55
  max_chars_per_line: 42
  position: bottom        # bottom | top | center

source_banner:            # bandeau "Sources : ..." ([source: ...])
  enabled: true
  fontsize: 28
  color: "0xDDDDDD"
  box_opacity: 0.45

intro:
  enabled: true
  seconds: 3.0
  title: null             # null -> titre lu dans le script (# Titre)
  subtitle: null
  background: "0x101418"  # couleur ou chemin d'une image
  fontsize: 72

music:
  path: null              # ex: assets/musique.mp3
  volume: 0.12            # 0..1 (volume de la musique sous la voix)
  fade_seconds: 1.5

audio:
  bitrate: 192k
  gap_seconds: 0.35       # petit silence entre deux segments

output:
  video_bitrate: null     # ex "8M" ; null -> qualité pilotée par le CRF
  crf: 20                 # plus bas = meilleure qualité, fichier plus lourd
  preset: medium          # ultrafast..veryslow (vitesse d'encodage)
